<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;direction:rtl}
button,.b,select,input{font:inherit;color:inherit}

header{box-shadow:0 3px 0 var(--ac);position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:8px 10px;background:var(--cd);border-bottom:1px solid var(--ln);align-items:center}

main{max-width:860px;margin:auto;padding:12px 12px 150px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}

.box{background:var(--cd);width:100%;max-width:780px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px}
.box h3{margin:0 0 8px}.box label,.box small{display:block;margin:8px 0 4px;color:var(--mu)}

.sym{display:flex;flex-wrap:wrap;gap:3px;border:1px solid var(--ln);border-radius:10px;padding:6px;margin-bottom:6px}.sym[hidden]{display:none}.sym button{min-width:34px;justify-content:center;padding:2px;min-height:34px}

.ed:empty:before{content:attr(data-ph);color:var(--mu)}
.orow{display:flex;gap:6px;align-items:center;margin:4px 0}.orow input[type=text],.orow .oi,.orow .ia,.orow .ib{flex:1}
.ft{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:sticky;bottom:-14px;background:var(--cd);padding:8px 0}
.r{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#ts{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
/* paper (shared by preview, PDF print and mirrored by the Word export) */
.paper{background:#fff;color:#000;direction:rtl;font-family:'B Nazanin','Vazirmatn',Tahoma,serif;font-size:14pt;line-height:1.7;width:210mm;padding:15mm;box-sizing:border-box}
.paper .q{margin:0 0 5px;break-inside:avoid}.paper .s{margin:0 0 4px}.paper .an{color:#0a6b3a;margin-top:2px}
.ed img,.paper img{max-width:340px;height:auto;vertical-align:middle}.ed img.sel{outline:3px solid var(--ac2)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.3}.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 3px}
.qt{border-collapse:collapse;margin:4px 0}.qt td{border:1px solid #444;padding:3px 8px;min-width:46px}
.ot,.mt{width:100%;border-collapse:collapse;table-layout:fixed}.ot td{vertical-align:top;padding:1px 4px}
.mt td:nth-child(1){width:42%}.mt td:nth-child(2){width:14%;text-align:center}.mt td:nth-child(3){width:44%}.mt td{vertical-align:top;padding:2px 4px}
.ln{border-bottom:1px dotted #888;height:1.7em}
.et{width:100%;border-collapse:collapse;table-layout:fixed}.et>thead>tr>th,.et>tbody>tr>td{border:1px solid #000;padding:4px 8px;vertical-align:top}.et>thead>tr>th{background:#e8e8e8;text-align:center}.et>thead>tr>th:nth-child(1),.et>tbody>tr>td:nth-child(1){width:9%;text-align:center}.et>thead>tr>th:nth-child(3),.et>tbody>tr>td:nth-child(3){width:12%;text-align:center}.et>tbody>tr{break-inside:avoid}
.sum{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:6px 12px;margin-bottom:10px;color:var(--ac);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px}nav button{font-size:13px;padding:6px 2px}
.ch{display:inline-flex;gap:4px;align-items:center;margin:2px 6px;cursor:pointer}
.bi{border:0;border-bottom:2px dotted var(--ac);background:transparent;min-width:90px;text-align:center;font:inherit;border-radius:0;padding:2px 4px}
.da{width:100%;margin-top:6px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:inherit;padding:8px;font:inherit}
.qc{font-family:'B Nazanin','Vazirmatn',Tahoma;font-size:18px;line-height:1.9}.qc img{max-width:100%;height:auto}.si{margin:6px 0}
#pp{display:none}#pp .paper{width:auto;padding:0}
@media print{.ui{display:none!important}#pp{display:block}@page{size:A4;margin:15mm}body{background:#fff}}
</style></head><body>

<script>
const PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);
const LT='الف ب پ ت ث ج چ ح خ د ذ ر'.split(' '),lt=i=>LT[i]||fa(i+1),clone=o=>structuredClone(o);
const TN={tf:'صحیح / غلط',blank:'جای‌خالی (نقطه‌چین)',mc:'چهارگزینه‌ای',paren:'گزینه‌ی صحیح در پرانتز',match:'وصل‌کردنی',desc:'تشریحی'};
const NEW={tf:()=>({type:'tf',html:'',ok:true}),blank:()=>({type:'blank',html:''}),mc:()=>({type:'mc',html:'',opts:['','','',''],ok:0,lay:4,ans:''}),paren:()=>({type:'paren',html:'',opts:['',''],ok:0}),match:()=>({type:'match',html:'',A:['',''],B:['',''],map:[0,1]}),desc:()=>({type:'desc',html:'',ans:'',lines:0})};
const SYM='✓ ✗ ☐ ☑ ☒ × ÷ ± √ ∞ ≠ ≤ ≥ ≈ π ° ² ³ ½ ⅓ ¼ ¾ → ← ↑ ↓ ⇒ ⇔ ∠ ⊥ ∥ △ ∈ ∉ ∪ ∩ ⊂ ∅ ∑ α β γ θ λ μ Δ Ω « » ؟ ، ؛ … – • ★ ✦ ‰ ∴ ∵ ≡ ∝ ∫'.split(' ');
let db,ex,exams=[],bank=[],T='ex',AN=0,ED=null,lastE=null,lastF=null,lastR=null,pt,BK={q:'',ty:'',s:''};
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2400)};
// ---------- storage (IndexedDB: large, device-quota based)
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('azmoon_online',1);r.onupgradeneeded=()=>{['exams','bank','results'].forEach(n=>r.result.objectStoreNames.contains(n)||r.result.createObjectStore(n,{keyPath:'id'}))};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>res(q?.result);t.onerror=()=>rej(t.error)});
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),all=s=>tx(s,'readonly',o=>o.getAll()),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const persist=()=>{clearTimeout(pt);pt=setTimeout(()=>{ex.t=Date.now();put('exams',ex)},300)};
function newExam(){ex={id:uid(),title:'آزمون جدید',rows:[],t:Date.now()};exams.push(ex);localStorage.ao_cur=ex.id;put('exams',ex);T='ex';render()}
const saveBlob=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
// ---------- helpers
const strip=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent};
const prep=(h,a)=>(h||'').replace(/\[\[(.*?)\]\]/g,(m,x)=>a?`<span class="bl a">${x}</span>`:'<span class="bl">………………</span>');
function lead(it,a){const t=prep(it.html,a);
 if(it.type=='tf')return t+` <span class="nb">(${a&&it.ok?'☒':'☐'} صحیح &nbsp; ${a&&!it.ok?'☒':'☐'} غلط)</span>`;
 if(it.type=='paren'){const o='( '+it.opts.map((x,i)=>a&&i==it.ok?`<b><u>${esc(x)}</u></b>`:esc(x)).join(' - ')+' )';return t.includes('{{}}')?t.replace('{{}}',o):t+' '+o}
 return t}
const optCell=(it,k,a)=>{const o=it.opts[k];return o==null?'':(a&&k==it.ok?`<b><u>${fa(k+1)}) ${esc(o)}</u></b>`:`${fa(k+1)}) ${esc(o)}`)};
function itemHtml(it,a){let h=lead(it,a);
 if(it.type=='mc'){const c=it.lay||4;let r='';for(let i=0;i<it.opts.length;i+=c)r+='<tr>'+Array.from({length:c},(_,j)=>`<td>${optCell(it,i+j,a)}</td>`).join('')+'</tr>';
  h+=`<table class="ot">${r}</table>`+(a?`<div class="an"><b>پاسخ:</b> گزینه‌ی ${fa(it.ok+1)}${it.ans?' — '+it.ans:''}</div>`:'')}
 if(it.type=='match'){let r='';const n=Math.max(it.A.length,it.B.length);for(let i=0;i<n;i++){const x=i<it.A.length;r+=`<tr><td>${x?fa(i+1)+'. '+esc(it.A[i]):''}</td><td>${x?'( '+(a?lt(it.map[i]):'&emsp;&emsp;')+' )':''}</td><td>${i<it.B.length?lt(i)+'. '+esc(it.B[i]):''}</td></tr>`}h+=`<table class="mt">${r}</table>`}
 if(it.type=='desc')h+='<div class="ln"></div>'.repeat(it.lines||0)+(a?`<div class="an"><b>پاسخ:</b> ${it.ans||''}</div>`:'');
 return h}
const sf=v=>fa(String(v).replace('.','٫')),total=()=>ex.rows.reduce((t,r)=>t+(+r.score||0),0);
function cellHtml(r,a){const s=r.items,t=r.title?`<div>${esc(r.title)}</div>`:'';if(s.length==1)return t+itemHtml(s[0],a);return t+s.map((it,i)=>`<div class="s"><b>${fa(i+1)})</b> ${itemHtml(it,a)}</div>`).join('')}
function paperHtml(a){return`<table class="et"><thead><tr><th>ردیف</th><th>سوالات</th><th>بارم</th></tr></thead><tbody>${ex.rows.map((r,i)=>`<tr><td>${fa(i+1)}</td><td>${cellHtml(r,a)}</td><td>${r.score?sf(r.score):''}</td></tr>`).join('')}</tbody></table>`}
// ---------- main views
function find(id){for(let ri=0;ri<ex.rows.length;ri++){const r=ex.rows[ri],ii=r.items.findIndex(x=>x.id==id);if(ii>=0)return{r,ri,ii,it:r.items[ii]}}}
function render(){$('#ttl').value=ex.title;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T));$('#add').style.display=T=='ex'?'':'none';
 $('#v').innerHTML=T=='ex'?vEx():T=='bk'?vBk():T=='ol'?vOl():T=='rs'?vRs():vOut();if(T=='bk'){bkChips();bkList()}if(T=='out')fitPv();if(T=='rs')rsDraw()}
function vEx(){if(!ex.rows.length)return'<div class="em">هنوز سؤالی نیست.<br>دکمه‌ی «＋ سؤال» را بزن.</div>';
 return `<div class="sum" id="sum">جمع بارم: ${sf(total())}</div>`+ex.rows.map((r,ri)=>`<section class="card" id="r_${r.id}"><div class="rh"><b>سوال ${fa(ri+1)}</b><input class="rtl" data-r="${r.id}" value="${esc(r.title)}" placeholder="دستور سؤال (اختیاری) مثلاً: جاهای خالی را پر کنید">
 <select class="sc" data-r="${r.id}" title="بارم">${scOpts(r)}</select><span class="acts"><button data-a="rup" data-r="${r.id}">↑</button><button data-a="rdn" data-r="${r.id}">↓</button>${ri?`<button data-a="mrg" data-r="${r.id}" title="ادغام با ردیف قبل">⇡ ادغام</button>`:''}<button data-a="rdel" data-r="${r.id}">🗑</button></span></div>
 ${r.items.map((it,ii)=>`<div class="it" id="i_${it.id}"><span class="tg">${r.items.length>1?fa(ii+1)+') ':''}${TN[it.type]}</span><span class="pv">${esc(strip(it.html).slice(0,90))||'(بدون متن)'}</span>
 <span class="acts"><button data-a="ied" data-i="${it.id}">✎</button><button data-a="iup" data-i="${it.id}">↑</button><button data-a="idn" data-i="${it.id}">↓</button>${r.items.length>1?`<button data-a="iout" data-i="${it.id}" title="خروج از ردیف">⤴ خروج</button>`:''}<button data-a="ibk" data-i="${it.id}" title="ذخیره در بانک">📥</button><button data-a="idel" data-i="${it.id}">🗑</button></span></div>`).join('')}
 <button data-a="addin" data-r="${r.id}">＋ سؤال در همین ردیف</button></section>`).join('')}
let SUBS=[],SC=null;try{SUBS=JSON.parse(localStorage.ao_subs||'[]')}catch{}
const saveSubs=()=>localStorage.ao_subs=JSON.stringify(SUBS),addSub=n=>{if(!SUBS.includes(n)){SUBS.push(n);saveSubs()}},subjects=()=>[...new Set([...SUBS,...bank.map(b=>b.subj).filter(Boolean)])];
function chooseSubj(cb){SC=cb;showM(`<h3>درس را انتخاب کن</h3><div class="r">${subjects().map((x,i)=>`<button class="p" data-x="bs" data-n="${i}">${esc(x)}</button>`).join('')}<button data-x="bs" data-n="-1">بدون درس</button></div><div class="orow"><input id="ns" placeholder="درس جدید (مثلاً ریاضی)"><button class="p" data-x="bsn">＋ ایجاد و انتخاب</button></div><button data-x="cl">انصراف</button>`)}
function bkChips(){const n=v=>bank.filter(b=>v==''?1:v=='_none'?!b.subj:b.subj==v).length,c=(v,t)=>`<button data-a="bsel" data-i="${esc(v)}" class="${BK.s==v?'p':''}">${esc(t)} (${fa(n(v))})</button>`;
 $('#bc').innerHTML=c('','همه')+subjects().map(x=>c(x,x)).join('')+c('_none','بدون درس')+'<button data-a="bnew">＋ درس جدید</button>'+(BK.s&&BK.s!='_none'?'<button data-a="bren">✎ نام درس</button><button data-a="bdsub">🗑 حذف درس</button>':'')}
const scOpts=r=>'<option value="0">بارم؟</option>'+Array.from({length:80},(_,i)=>{const v=(i+1)*.25;return`<option value="${v}" ${r.score==v?'selected':''}>${sf(v)}</option>`}).join('');
const vBk=()=>`<div class="r" id="bc"></div><div class="r"><input id="bq" placeholder="جست‌وجو در بانک…" style="flex:1" value="${esc(BK.q)}"><select id="bt"><option value="">همه‌ی انواع</option>${Object.entries(TN).map(([k,v])=>`<option value="${k}" ${BK.ty==k?'selected':''}>${v}</option>`).join('')}</select></div><div id="bl"></div>`;
function bkList(){const l=bank.filter(b=>(!BK.ty||b.item.type==BK.ty)&&(BK.s==''||(BK.s=='_none'?!b.subj:b.subj==BK.s))&&(!BK.q||strip(b.item.html).includes(BK.q))).sort((a,b)=>b.t-a.t);
 $('#bl').innerHTML=l.length?l.map(b=>`<div class="it"><span class="tg">${TN[b.item.type]}</span>${b.subj?`<span class="tg" style="background:var(--ac2);color:#2b1a00">${esc(b.subj)}</span>`:''}<span class="pv">${esc(strip(b.item.html).slice(0,90))}</span><span class="acts"><button class="p" data-a="bad" data-i="${b.id}">＋ به آزمون</button><button data-a="bsub" data-i="${b.id}" title="تغییر درس">🏷</button><button data-a="bed" data-i="${b.id}">✎</button><button data-a="bdel" data-i="${b.id}">🗑</button></span></div>`).join(''):`<div class="em">بانک خالی است (${fa(bank.length)} سؤال).<br>در تب آزمون روی 📥 بزن.</div>`}
const vOut=()=>`<div class="card"><div class="r"><button class="p" data-a="pdf0">PDF بدون پاسخ</button><button class="p" data-a="pdf1">PDF با پاسخ</button></div><div class="r"><button class="p" data-a="doc0">Word بدون پاسخ</button><button class="p" data-a="doc1">Word با پاسخ</button></div><div class="r"><button data-a="json">ذخیره‌ی JSON این آزمون</button><button data-a="pv0" class="${AN?'':'p'}">پیش‌نمایش: بدون پاسخ</button><button data-a="pv1" class="${AN?'p':''}">با پاسخ</button></div><small style="color:var(--mu)">PDF: در پنجره‌ی چاپ «ذخیره به‌صورت PDF» را انتخاب کن.</small></div><div style="overflow:hidden"><div class="paper" id="pv">${paperHtml(AN)}</div></div>`;
function fitPv(){const p=$('#pv');if(p)p.style.zoom=Math.min(1,($('#v').clientWidth-4)/794)}
function flash(id){const e=$('#'+id);e?.scrollIntoView({block:'center',behavior:'smooth'});e?.classList.add('fl');setTimeout(()=>e?.classList.remove('fl'),1800)}
const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return false;[a[i],a[j]]=[a[j],a[i]];return true};
$('#v').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,rid=b.dataset.r,id=b.dataset.i,ri=ex.rows.findIndex(r=>r.id==rid),F=id&&find(id);
 if(a=='rup'||a=='rdn'){if(mv(ex.rows,ri,a=='rup'?-1:1)){persist();render();flash('r_'+rid)}}
 else if(a=='rdel'){if(confirm('این سؤال با همه‌ی بخش‌هایش حذف شود؟')){ex.rows.splice(ri,1);persist();render()}}
 else if(a=='mrg'){ex.rows[ri-1].items.push(...ex.rows[ri].items);const t=ex.rows[ri-1].id;ex.rows.splice(ri,1);persist();render();flash('r_'+t)}
 else if(a=='addin')pick(rid);
 else if(a=='ied')openEd(F.it.type,{item:F.it});

function arrayBufferToBase64Url(buf){
  let binary=''; const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64UrlToArrayBuffer(b64url){
  let b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function encodeData(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  if('CompressionStream' in window){
    try{
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      writer.write(bytes); writer.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'g' + arrayBufferToBase64Url(buf);
    }catch(e){}
  }
  return 'r' + arrayBufferToBase64Url(bytes.buffer);
}
// Shrinks an image data-URL (resize + re-encode as JPEG) so attached images
// can travel inside the self-contained exam link instead of being dropped.
// The original full-quality image is kept in the local project (and in the
// PDF/Word export) — only the copy embedded in the link is downsized.
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w<=0 || h<=0){ resolve(null); return; }
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // flatten transparency (PNG) before JPEG encode
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ resolve(null); }
      };
      img.onerror = ()=> resolve(null);
      img.src = dataUrl;
    }catch(e){ resolve(null); }
  });
}
async function decodeData(str){
  const tag = str[0]; const b64 = str.slice(1);
  const buf = base64UrlToArrayBuffer(b64);
  if(tag==='g'){
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    const readPromise = new Response(ds.readable).arrayBuffer();
    // write()/close() return promises too, and on invalid/corrupted input
    // they can reject independently of readPromise; if left unhandled that
    // shows up as noisy uncaught-rejection errors even though the failure
    // is already properly surfaced (and handled by callers) via readPromise.
    writer.write(new Uint8Array(buf)).catch(()=>{});
    writer.close().catch(()=>{});
    const outBuf = await readPromise;
    return JSON.parse(new TextDecoder().decode(outBuf));
  }
  return JSON.parse(new TextDecoder().decode(buf));
}
