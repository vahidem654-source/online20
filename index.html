function arrayBufferToBase64Url(buf){
  let binary=''; const bytes=new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) binary+=String.fromCharCode(bytes[i]);
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64UrlToArrayBuffer(b64url){
  let b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes.buffer;
}
async function encodeData(obj){
  const json = JSON.stringify(obj);
  const bytes = new TextEncoder().encode(json);
  if('CompressionStream' in window){
    try{
      const cs = new CompressionStream('gzip');
      const writer = cs.writable.getWriter();
      writer.write(bytes); writer.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'g' + arrayBufferToBase64Url(buf);
    }catch(e){}
  }
  return 'r' + arrayBufferToBase64Url(bytes.buffer);
}
// Shrinks an image data-URL (resize + re-encode as JPEG) so attached images
// can travel inside the self-contained exam link instead of being dropped.
// The original full-quality image is kept in the local project (and in the
// PDF/Word export) — only the copy embedded in the link is downsized.
function compressImageDataUrl(dataUrl, maxDim, quality){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w<=0 || h<=0){ resolve(null); return; }
        if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // flatten transparency (PNG) before JPEG encode
        ctx.drawImage(img, 0, 0, w, h);
        try{ resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ resolve(null); }
      };
      img.onerror = ()=> resolve(null);
      img.src = dataUrl;
    }catch(e){ resolve(null); }
  });
}
async function decodeData(str){
  const tag = str[0]; const b64 = str.slice(1);
  const buf = base64UrlToArrayBuffer(b64);
  if(tag==='g'){
    const ds = new DecompressionStream('gzip');
    const writer = ds.writable.getWriter();
    const readPromise = new Response(ds.readable).arrayBuffer();
    // write()/close() return promises too, and on invalid/corrupted input
    // they can reject independently of readPromise; if left unhandled that
    // shows up as noisy uncaught-rejection errors even though the failure
    // is already properly surfaced (and handled by callers) via readPromise.
    writer.write(new Uint8Array(buf)).catch(()=>{});
    writer.close().catch(()=>{});
    const outBuf = await readPromise;
    return JSON.parse(new TextDecoder().decode(outBuf));
  }
  return JSON.parse(new TextDecoder().decode(buf));
}

const GS_TEMPLATE="var SUBMIT_KEY='__SK__';\nvar ADMIN_KEY='__AK__';\nvar VERSION=2;\nfunction out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}\nfunction getSheet(ss,name,head){var s=ss.getSheetByName(name);if(!s){s=ss.insertSheet(name);s.appendRow(head);}return s;}\nfunction blankRows(n){var b=[];for(var i=0;i<n;i++){b.push(['','','']);}return b;}\nfunction doPost(e){\n  try{\n    var d=JSON.parse(e.postData.contents);\n    if(d&&d.a==='sput'){\n      if(d.ak!==ADMIN_KEY)return out({ok:false,e:'key'});\n      if(!d.key)return out({ok:false,e:'data'});\n      return syncPut(d);\n    }\n    if(!d||d.k!==SUBMIT_KEY)return out({ok:false,e:'key'});\n    if(!d.id||!d.code||String(d.code).length>9000000)return out({ok:false,e:'data'});\n    var lock=LockService.getScriptLock();\n    lock.waitLock(28000);\n    try{\n      var ss=SpreadsheetApp.getActive();\n      var sh=getSheet(ss,'نتایج',['زمان','آزمون','نام','کلاس','شناسه','ردیف داده','تعداد بخش']);\n      var dt=getSheet(ss,'Data',['شناسه','بخش','متن']);\n      var n=sh.getLastRow();\n      var ids=n>1?sh.getRange(2,5,n-1,1).getValues():[];\n      for(var i=0;i<ids.length;i++){if(ids[i][0]===d.id)return out({ok:true,dup:true});}\n      var c=String(d.code),N=40000,rows=[],k=0;\n      for(var p=0;p<c.length;p+=N,k++){rows.push([d.id,k,c.slice(p,p+N)]);}\n      var start=dt.getLastRow()+1;\n      dt.getRange(start,1,rows.length,3).setValues(rows);\n      sh.appendRow([new Date(),d.title||'',d.name||'',d.cls||'',d.id,start,rows.length]);\n      try{dt.hideSheet();}catch(x){}\n      return out({ok:true});\n    }finally{lock.releaseLock();}\n  }catch(err){return out({ok:false,e:String(err)});}\n}\nfunction syncPut(d){\n  var lock=LockService.getScriptLock();\n  lock.waitLock(28000);\n  try{\n    var ss=SpreadsheetApp.getActive();\n    var ix=getSheet(ss,'Sync',['کلید','زمان','حذف','ردیف','تعداد']);\n    var dt=getSheet(ss,'SyncData',['کلید','بخش','متن']);\n    var n=ix.getLastRow();\n    var v=n>1?ix.getRange(2,1,n-1,5).getValues():[];\n    var row=-1;\n    for(var i=0;i<v.length;i++){if(v[i][0]===d.key){row=i;break;}}\n    if(row>=0&&Number(v[row][1])>Number(d.t))return out({ok:true,stale:true});\n    var c=d.del?'':String(d.data||''),N=40000,parts=[],k=0;\n    for(var p=0;p<c.length;p+=N,k++){parts.push([d.key,k,'~'+c.slice(p,p+N)]);}\n    var count=parts.length,start=0;\n    if(row>=0){\n      var os=Number(v[row][3]),oc=Number(v[row][4]);\n      if(oc>0&&count<=oc){\n        start=os;\n        if(count>0)dt.getRange(start,1,count,3).setValues(parts);\n        if(oc>count)dt.getRange(start+count,1,oc-count,3).setValues(blankRows(oc-count));\n      }else{\n        if(oc>0)dt.getRange(os,1,oc,3).setValues(blankRows(oc));\n        start=dt.getLastRow()+1;\n        if(count>0)dt.getRange(start,1,count,3).setValues(parts);\n      }\n      ix.getRange(row+2,1,1,5).setValues([[d.key,d.t,d.del?1:0,start,count]]);\n    }else{\n      start=dt.getLastRow()+1;\n      if(count>0)dt.getRange(start,1,count,3).setValues(parts);\n      ix.appendRow([d.key,d.t,d.del?1:0,start,count]);\n    }\n    try{dt.hideSheet();}catch(x){}\n    return out({ok:true});\n  }finally{lock.releaseLock();}\n}\nfunction doGet(e){\n  try{\n    var p=e.parameter||{};\n    if(p.k!==ADMIN_KEY)return out({ok:false,e:'key'});\n    if(p.a==='ping')return out({ok:true,v:VERSION});\n    var ss=SpreadsheetApp.getActive();\n    if(p.a==='slist'||p.a==='sget'){\n      var ix=ss.getSheetByName('Sync');\n      var n=ix?ix.getLastRow():0;\n      var v=n>1?ix.getRange(2,1,n-1,5).getValues():[];\n      if(p.a==='slist'){return out({ok:true,rows:v.map(function(r){return {key:r[0],t:Number(r[1]),del:Number(r[2])===1};})});}\n      for(var i=0;i<v.length;i++){\n        if(v[i][0]===p.key){\n          var dt=ss.getSheetByName('SyncData');\n          var cnt=Number(v[i][4]),s='';\n          if(cnt>0){\n            var rows=dt.getRange(Number(v[i][3]),1,cnt,3).getValues();\n            for(var j=0;j<rows.length;j++){s+=String(rows[j][2]).substring(1);}\n          }\n          return out({ok:true,code:s});\n        }\n      }\n      return out({ok:false,e:'none'});\n    }\n    var sh=ss.getSheetByName('نتایج');\n    var m=sh?sh.getLastRow():0;\n    var w=m>1?sh.getRange(2,1,m-1,7).getValues():[];\n    if(p.a==='list'){return out({ok:true,rows:w.map(function(r){return {t:+new Date(r[0]),title:r[1],name:r[2],cls:r[3],id:r[4]};})});}\n    if(p.a==='get'){\n      for(var a=0;a<w.length;a++){\n        if(w[a][4]===p.id){\n          var dd=ss.getSheetByName('Data');\n          var rr=dd.getRange(w[a][5],1,w[a][6],3).getValues();\n          var t='';\n          for(var b=0;b<rr.length;b++){t+=rr[b][2];}\n          return out({ok:true,code:t});\n        }\n      }\n      return out({ok:false,e:'none'});\n    }\n    return out({ok:false,e:'a'});\n  }catch(err){return out({ok:false,e:String(err)});}\n}\n";
const COL=()=>{try{return JSON.parse(localStorage.ao_col||'{}')||{}}catch{return{}}},colSave=c=>localStorage.ao_col=JSON.stringify(c),rk=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(36).padStart(2,'0')).join('');
function colInit(){const c=COL();if(!c.sk||!c.ak){c.sk=rk();c.ak=rk();colSave(c)}return c}
const colExport=()=>{const c=colInit();return c.u?'AO1:'+btoa(unescape(encodeURIComponent(JSON.stringify({u:c.u,sk:c.sk,ak:c.ak})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''):''};
function colImport(v){v=String(v||'').trim();if(!v.startsWith('AO1:'))return false;try{let b=v.slice(4).replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const o=JSON.parse(decodeURIComponent(escape(atob(b))));if(!o.u||!o.sk||!o.ak)return false;colSave({u:o.u,sk:o.sk,ak:o.ak});return true}catch(e){return false}}
const scriptCode=c=>GS_TEMPLATE.replace('__SK__',c.sk).replace('__AK__',c.ak);
async function pullCloud(){const C=colInit();if(!C.u)return toast('اول در تب آنلاین آدرس Web app را وارد کن');toast('در حال دریافت فهرست…');
 const g=q=>fetch(C.u+'?k='+C.ak+'&'+q).then(r=>r.json());
 try{const j=await g('a=list');if(!j.ok)throw 0;const key='ao_pk_'+RS.ex,pk=JSON.parse(localStorage[key]||'[]'),all_=j.rows.filter(r=>String(r.id).startsWith(RS.ex+'|')),mine=all_.filter(r=>!pk.includes(r.id));
  if(!mine.length){toast('نتیجه‌ی جدیدی نیست ('+fa(all_.length)+' نتیجه در شیت)');return}
  const q=[...mine],codes=[],ok=[];let done=0;
  await Promise.all([0,1,2].map(async()=>{while(q.length){const r=q.shift();try{const x=await g('a=get&id='+encodeURIComponent(r.id));if(x.ok){codes.push(x.code);ok.push(r.id)}}catch(e){}toast('دریافت '+fa(++done)+' از '+fa(mine.length))}}));
  await addCodes(codes.join('\n'));localStorage[key]=JSON.stringify([...pk,...ok]);if(ok.length<mine.length)toast(fa(mine.length-ok.length)+' نتیجه دریافت نشد؛ دوباره بزن')
 }catch(e){toast('اتصال به Google Sheet برقرار نشد. آدرس و اینترنت را بررسی کن.')}}

 if(a=='gcopy'){const c=colInit();try{await navigator.clipboard.writeText(scriptCode(c))}catch{const t=$('#g_code');if(t){t.parentElement.open=true;t.select();document.execCommand('copy')}}toast('کد اسکریپت کپی شد')}

   else msg='❌ سرور جواب داد ولی جوابش از اسکریپت ما نبود: «'+esc(t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,110))+'». معمولاً یعنی کد درست ذخیره/Deploy نشده یا آدرس ناقص است (باید با /exec تمام شود).'}
  catch(err){let reach=false;try{await fetch(url,{mode:'no-cors',signal:AbortSignal.timeout?AbortSignal.timeout(15000):undefined});reach=true}catch(e2){}
   msg=reach?'❌ گوگل در دسترس است ولی مرورگر اجازه‌ی خواندن پاسخ را نداد. تقریباً همیشه یعنی «Who has access» روی Anyone نیست (یا «Execute as» روی Me نیست). در Deploy ← Manage deployments ← ✏️ آن را اصلاح کن، Version را New version بگذار و Deploy کن.':'❌ به گوگل وصل نشد؛ اینترنت یا فیلتر جلوی script.google.com را گرفته است.'}
  st.innerHTML=msg+'<div class="r"><a class="b" href="'+esc(url)+'" target="_blank" rel="noopener">🔎 باز کردن آدرس آزمایشی در تب جدید</a></div>'}
 else if(a=='gexp'){const t=colExport();if(!t)return toast('اول آدرس Web app را وارد کن');try{await navigator.clipboard.writeText(t);toast('کد اتصال کپی شد؛ برای خودت بفرست و در گوشی وارد کن')}catch(e){prompt('این کد را کپی کن:',t)}}
 else if(a=='gimp'){if(colImport($('#g_imp').value)){toast('اتصال وارد شد؛ در حال آزمایش…');render();setTimeout(()=>{const t=document.querySelector('[data-a=gtest]');if(t)t.click()},300)}else toast('کد اتصال معتبر نیست؛ باید با AO1: شروع شود')}

let syT=0,syBusy=false,syLast=0;
const SYN=()=>localStorage.ao_sync==='1',syStat=t=>{localStorage.ao_syst=t;const e=$('#sy_st');if(e)e.textContent=t};
const syCall=async(q,body)=>{const C=COL();if(!C.u)throw new Error('nourl');
 const r=body?await fetch(C.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,ak:C.ak})}):await fetch(C.u+'?k='+C.ak+'&'+q),j=await r.json();
 if(!j.ok){throw new Error(j.e==='a'?'oldscript':j.e==='key'?'key':(j.e||'x'))}return j};
const syncSoon=()=>{if(!SYN())return;clearTimeout(syT);syT=setTimeout(()=>syncAll(true),8000)};
const syPend=()=>{try{return JSON.parse(localStorage.ao_sydel||'[]')}catch(e){return[]}},syPendSet=a=>localStorage.ao_sydel=JSON.stringify(a);
function syDel(id){if(!SYN())return;syPendSet([...new Set([...syPend(),id])]);syncSoon()}
async function syncAll(force){if(!SYN()||syBusy||!COL().u||!db)return;if(!force&&Date.now()-syLast<20000)return;syBusy=true;syLast=Date.now();
 try{syStat('⏳ در حال همگام‌سازی…');
  for(const id of syPend()){await syCall('',{a:'sput',key:'exam:'+id,t:Date.now(),del:1,data:''});syPendSet(syPend().filter(x=>x!=id))}
  const pend=syPend(),L=await syCall('a=slist'),R={};L.rows.forEach(r=>R[r.key]=r);let ch=0;
  const strip_=e=>{const c={...e};delete c.st;return c},
   push=async e=>{await syCall('',{a:'sput',key:'exam:'+e.id,t:e.t,del:0,data:await encodeData(strip_(e))});e.st=e.t;await put('exams',e)},
   pull=async key=>{const x=await syCall('a=sget&key='+encodeURIComponent(key)),o=await decodeData(x.code);o.st=o.t;return o},
   apply=async o=>{const i=exams.findIndex(k=>k.id==o.id);if(i>=0)exams[i]=o;else exams.push(o);await put('exams',o);if(ex&&ex.id==o.id)ex=o;ch++};
  for(const e of [...exams]){const r=R['exam:'+e.id];
   if(!r){if(!e.rows.length&&e.title==='آزمون جدید')continue;await push(e);ch++;continue}
   const st=e.st||0,lc=e.t>st,rc=r.t>st;
   if(r.t===e.t&&!r.del){if(e.st!==e.t){e.st=e.t;await put('exams',e)}continue}
   if(!lc&&rc){if(r.del){await del('exams',e.id);exams=exams.filter(k=>k.id!=e.id);if(ex&&ex.id==e.id)ex=exams[0]||null;ch++}else await apply(await pull('exam:'+e.id));continue}
   if(lc&&!rc){await push(e);ch++;continue}
   if(lc&&rc){if(r.del){await push(e);ch++;continue}
    const o=await pull('exam:'+e.id);
    if(r.t>e.t){const cp=clone(e);cp.id=uid();cp.title+=' (نسخه‌ی قبلی این دستگاه)';delete cp.st;cp.t=Date.now();exams.push(cp);await put('exams',cp);await apply(o)}
    else{const cp=clone(o);cp.id=uid();cp.title+=' (نسخه‌ی دستگاه دیگر)';delete cp.st;cp.t=Date.now();exams.push(cp);await put('exams',cp);await push(e)}
    ch++}}
  for(const key in R){if(!key.startsWith('exam:'))continue;const id=key.slice(5),r=R[key];if(!r.del&&!pend.includes(id)&&!exams.some(k=>k.id==id))await apply(await pull(key))}
  {const bid=localStorage.ao_blank;if(bid){const be=exams.find(k=>k.id==bid);if(be&&!be.rows.length&&be.title==='آزمون جدید'&&!be.st&&exams.length>1){await del('exams',be.id);exams=exams.filter(k=>k.id!=bid);if(ex&&ex.id==bid)ex=exams[0];ch++}if(!be||exams.length>1)localStorage.removeItem('ao_blank')}}
  syStat('✅ آخرین همگام‌سازی: '+new Date().toLocaleTimeString('fa-IR'));
  if(ch){if(!exams.length)newExam();else if(!ex)ex=exams[0];render()}
 }catch(err){syStat(err.message=='oldscript'?'⚠️ کد اسکریپت گوگل قدیمی است؛ «کپی کد اسکریپت» را بزن، جایگزین کن و New version منتشر کن.':err.message=='key'?'⚠️ کلید قبول نشد؛ «کد اتصال» را دوباره وارد کن.':'⚠️ همگام‌سازی انجام نشد (اینترنت یا اتصال).')}finally{syBusy=false}}
